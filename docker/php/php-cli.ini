[PHP]
; Configuration PHP CLI pour masquer les dépréciations PHP 8.4 de Symfony 6.3

; Désactiver l'affichage des erreurs dans la console
display_errors = Off
display_startup_errors = Off

; Log uniquement les erreurs critiques
error_reporting = E_ERROR | E_PARSE | E_CORE_ERROR | E_COMPILE_ERROR

; Log dans un fichier
log_errors = On
error_log = /tmp/php_errors.log

; Performance
memory_limit = 512M
max_execution_time = 300
date.timezone = Europe/Paris


