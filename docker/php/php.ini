[PHP]
; Configuration PHP pour le développement

; Temps d'exécution
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Upload de fichiers
upload_max_filesize = 64M
post_max_size = 64M

; Affichage des erreurs (développement)
display_errors = On
display_startup_errors = On
; Masquer les avertissements de dépréciation pour PHP 8.4 (compatibilité Symfony 6.3)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; Désactiver l'affichage des dépréciations au niveau du moteur
zend.exception_ignore_args = Off
; Log des erreurs dans un fichier au lieu de les afficher
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = Europe/Paris

; Opcache
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

; Session
session.save_handler = files
session.save_path = "/tmp"
session.gc_maxlifetime = 3600

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600



